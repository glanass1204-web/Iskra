name: Remove GigaChat release

# Разовая уборка: удалить выпуск с дополнением GigaChat (по решению пользователя модель не используется).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete iskra-model-gigachat --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
