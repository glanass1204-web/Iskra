name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew --no-daemon :core:test

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk iskra.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iskra-apk
          path: iskra.apk

      # Последняя сборка всегда лежит по одной ссылке:
      # https://github.com/<владелец>/<репозиторий>/releases/download/iskra-latest/iskra.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete iskra-latest --yes --cleanup-tag || true
          gh release create iskra-latest iskra.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Искра — последняя сборка" \
            --notes "Сборка ${GITHUB_RUN_NUMBER} . Скачай iskra.apk на телефон и установи."
