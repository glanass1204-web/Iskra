name: AI quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "windows/iskra_ai.py"
      - "windows/ai_eval.py"
      - ".github/workflows/ai-check.yml"

jobs:
  eval:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model:
          - https://huggingface.co/bartowski/Qwen_Qwen3.5-4B-GGUF/resolve/main/Qwen_Qwen3.5-4B-Q4_K_M.gguf
          # та же Qwen3.5-4B, но с головой MTP — движок пишет несколько слов за шаг (быстрее, тот же текст)
          - https://huggingface.co/unsloth/Qwen3.5-4B-MTP-GGUF/resolve/main/Qwen3.5-4B-Q4_K_M.gguf
          # Google Gemma 4 E4B (4,6 ГБ) — формат реплик берётся из шаблона в файле модели
          - https://huggingface.co/ggml-org/gemma-4-E4B-it-GGUF/resolve/main/gemma-4-E4B-it-Q4_0.gguf
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache model
        uses: actions/cache@v4
        with:
          path: windows/eval/models
          key: eval-${{ matrix.model }}
      - name: Engine and model
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./get_engine.ps1 -Target eval/engine
          ./get_model.ps1 -Target eval/models -Url '${{ matrix.model }}'
      - name: Evaluate (network blocked for the engine)
        shell: pwsh
        run: |
          $engine = Get-ChildItem eval/engine -Include llama-completion.exe, llama-cli.exe -Recurse | Select-Object -First 1
          New-NetFirewallRule -DisplayName 'engine offline' -Direction Outbound -Program $engine.FullName -Action Block | Out-Null
          $env:PYTHONIOENCODING = 'utf-8'
          python ai_eval.py eval
