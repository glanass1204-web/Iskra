name: Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        shell: bash
        run: for t in test_*.py; do echo "== $t"; python "$t" || exit 1; done

      - name: Build EXE
        shell: cmd
        run: build_windows.bat nopause

      - name: Check EXE starts
        shell: pwsh
        run: |
          $p = Start-Process dist/Iskra/Iskra.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Iskra.exe закрылась сразу, код $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          Write-Host 'Iskra.exe запускается и работает'

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Iskra -DestinationPath Iskra-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Iskra-Windows
          path: windows/Iskra-Windows.zip

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete iskra-windows-latest --yes --cleanup-tag || true
          gh release create iskra-windows-latest Iskra-Windows.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Искра для Windows — последняя сборка" \
            --notes "Сборка ${GITHUB_RUN_NUMBER}. Распакуйте архив целиком и запустите Iskra.exe. Python и интернет не нужны."
