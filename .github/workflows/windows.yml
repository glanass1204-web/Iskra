name: Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        shell: bash
        run: for t in test_*.py; do echo "== $t"; python "$t" || exit 1; done

      - name: Build EXE
        shell: cmd
        run: build_windows.bat nopause

      - name: Check EXE starts
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Iskra/_internal/dict/ru_RU.dic)) { throw 'В сборке нет словаря' }
          $t = Start-Process dist/Iskra/Iskra.exe -ArgumentList '--selftest' -PassThru -Wait
          Get-Content dist/Iskra/data/selftest.txt
          if ($t.ExitCode -ne 0) { throw "Самопроверка не пройдена: $($t.ExitCode)" }
          Remove-Item dist/Iskra/data -Recurse -Force
          $p = Start-Process dist/Iskra/Iskra.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Iskra.exe закрылась сразу, код $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          Write-Host 'Iskra.exe запускается и работает'

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Iskra -DestinationPath Iskra-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Iskra-Windows
          path: windows/Iskra-Windows.zip

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: windows/model-cache
          key: model-qwen3.5-4b-q4km-v1

      - name: Bundle neural network
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force dist-ai | Out-Null
          Copy-Item dist/Iskra dist-ai/Iskra -Recurse
          ./get_engine.ps1 -Target dist-ai/Iskra/engine -Tools split-tool
          ./get_model.ps1 -Target model-cache
          New-Item -ItemType Directory -Force dist-ai/Iskra/models | Out-Null
          # Модель 2,8 ГБ, а GitHub принимает файлы до 2 ГБ: режем на части, llama.cpp сам читает их по порядку.
          $model = Get-ChildItem model-cache/*.gguf | Select-Object -First 1
          & split-tool/llama-gguf-split.exe --split --split-max-size 400M $model.FullName (Join-Path (Resolve-Path dist-ai/Iskra/models) $model.BaseName)
          if ($LASTEXITCODE -ne 0) { throw "Не удалось разрезать модель: $LASTEXITCODE" }
          Copy-Item model-cache/README.txt dist-ai/Iskra/models/
          Get-ChildItem dist-ai/Iskra/engine, dist-ai/Iskra/models | Select-Object Name, Length | Format-Table

      - name: Engine has everything it needs
        shell: pwsh
        run: |
          # На сервере сборки Visual C++ установлен, на рабочих компьютерах — не всегда: всё нужное должно быть в engine.
          python -m pip install pefile
          python check_engine_deps.py dist-ai/Iskra/engine
          if ($LASTEXITCODE -ne 0) { throw 'Движку не хватает библиотек в папке engine' }

      - name: Neural network works without internet
        shell: pwsh
        run: |
          # Сеть закрыта брандмауэром Windows для Искры и движка нейросети; проверяем, что запрет действует.
          Get-NetFirewallProfile | Select-Object Name, Enabled | Format-Table
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          $iskra = (Resolve-Path dist-ai/Iskra/Iskra.exe).Path
          $engine = Get-ChildItem dist-ai/Iskra/engine -Include llama-completion.exe, llama-cli.exe -Recurse | Select-Object -First 1
          $curl = (Get-Command curl.exe).Source
          foreach ($prog in @($iskra, $engine.FullName, $curl)) {
            New-NetFirewallRule -DisplayName "Iskra offline $prog" -Direction Outbound -Program $prog -Action Block | Out-Null
          }
          & $curl -s -m 15 -o NUL https://huggingface.co
          if ($LASTEXITCODE -eq 0) { throw 'Запрет сети не действует — проверка была бы нечестной' }
          Write-Host "Запрет сети действует (curl: код $LASTEXITCODE)"
          $global:LASTEXITCODE = 0
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $t = Start-Process $iskra -ArgumentList '--selftest-ai' -PassThru -Wait
          Write-Host "Секунд всего: $([int]$sw.Elapsed.TotalSeconds)"
          Get-Content dist-ai/Iskra/data/selftest_ai.txt -Encoding utf8
          if ($t.ExitCode -ne 0) { throw "Самопроверка нейросети не пройдена: $($t.ExitCode)" }
          Remove-Item dist-ai/Iskra/data -Recurse -Force

      - name: Zip with neural network
        shell: pwsh
        run: |
          # Маленькие части (до ~400 МБ), чтобы скачивание не обрывалось: часть 1 — программа и движок,
          # остальные — по одной части модели. Все распаковываются в одну папку.
          New-Item -ItemType Directory -Force parts | Out-Null
          $models = Get-ChildItem dist-ai/Iskra/models/*.gguf | Sort-Object Name
          New-Item -ItemType Directory -Force stage-models | Out-Null
          $models | Move-Item -Destination stage-models/
          Push-Location dist-ai
          7z a -tzip -mx=1 ../parts/Iskra-AI-chast-01.zip Iskra | Out-Null
          Pop-Location
          $i = 2
          foreach ($m in (Get-ChildItem stage-models/*.gguf | Sort-Object Name)) {
            $dir = "stage-$i/Iskra/models"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Move-Item $m.FullName $dir
            Push-Location "stage-$i"
            7z a -tzip -mx=1 ("../parts/Iskra-AI-chast-{0:D2}.zip" -f $i) Iskra | Out-Null
            Pop-Location
            $i++
          }
          Get-ChildItem parts | ForEach-Object {
            Write-Host "$($_.Name): $([math]::Round($_.Length / 1MB)) МБ"
            if ($_.Length -ge 2GB) { throw "$($_.Name) больше 2 ГБ" }
          }
          "Всего частей: $((Get-ChildItem parts).Count)" | Write-Host

      - name: Works as a user unpacks it
        shell: pwsh
        run: |
          # Как у пользователя: русские буквы в пути и во временной папке, «Извлечь всё» — каждый архив в свою папку.
          $root = 'C:\Проверка Искры\Загрузки'
          New-Item -ItemType Directory -Force $root | Out-Null
          foreach ($z in Get-ChildItem parts/*.zip) {
            7z x $z.FullName ("-o" + (Join-Path $root $z.BaseName)) -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Не распаковался $($z.Name)" }
          }
          $global:LASTEXITCODE = 0
          $tempDir = 'C:\Проверка Искры\Временные'
          New-Item -ItemType Directory -Force $tempDir | Out-Null
          $env:TEMP = $tempDir; $env:TMP = $tempDir
          $app = Join-Path $root 'Iskra-AI-chast-01\Iskra'
          $t = Start-Process (Join-Path $app 'Iskra.exe') -ArgumentList '--selftest-ai' -PassThru -Wait
          Get-Content (Join-Path $app 'data\selftest_ai.txt') -Encoding utf8
          if ($t.ExitCode -ne 0) { throw "Нейросеть не работает при распаковке по отдельным папкам: $($t.ExitCode)" }
          Remove-Item 'C:\Проверка Искры' -Recurse -Force

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete iskra-windows-latest --yes --cleanup-tag || true
          gh release create iskra-windows-latest parts/*.zip Iskra-Windows.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Искра для Windows — последняя сборка" \
            --notes "Сборка ${GITHUB_RUN_NUMBER}. ОБНОВЛЕНИЕ: если Искра с нейросетью уже скачана — скачайте только Iskra-AI-chast-01 (программа и движок) и распакуйте поверх старой с заменой файлов; части модели 02 … NN не меняются, ваши данные сохраняются. С нейросетью: скачайте ВСЕ файлы Iskra-AI-chast-01 … chast-NN (каждый до 400 МБ) и распакуйте их в одну и ту же папку (если распаковали каждый в свою папку рядом — Искра соберёт части сама), затем запустите Iskra\\Iskra.exe. Проверка: меню Файл → Проверить нейросеть. Если какой-то файл не докачался — скачайте заново только его. Без нейросети: Iskra-Windows.zip (35 МБ). Интернет для работы не нужен."
