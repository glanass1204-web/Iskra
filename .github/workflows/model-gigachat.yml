name: Model GigaChat (add-on)

# Запускается вручную один раз: выкладывает отечественную модель GigaChat 3.1 (Сбер, MIT) отдельным выпуском,
# частями по ~400 МБ. Обычные сборки Искры её не качают и не тяжелеют.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - name: Cache model
        uses: actions/cache@v4
        with:
          path: windows/gigachat-cache
          key: model-gigachat3.1-10b-a1.8b-q4km-v1
      - name: Download and split
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./get_engine.ps1 -Target engine-tmp -Tools split-tool
          ./get_model.ps1 -Target gigachat-cache -Url 'https://huggingface.co/ai-sage/GigaChat3.1-10B-A1.8B-GGUF/resolve/main/GigaChat3.1-10B-A1.8B-q4_K_M.gguf'
          $model = Get-ChildItem gigachat-cache/*.gguf | Select-Object -First 1
          New-Item -ItemType Directory -Force split | Out-Null
          & split-tool/llama-gguf-split.exe --split --split-max-size 400M $model.FullName (Join-Path (Resolve-Path split) $model.BaseName)
          if ($LASTEXITCODE -ne 0) { throw "Не удалось разрезать модель: $LASTEXITCODE" }
          New-Item -ItemType Directory -Force parts | Out-Null
          $i = 1
          foreach ($m in (Get-ChildItem split/*.gguf | Sort-Object Name)) {
            $dir = "stage-$i/Iskra/models"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Move-Item $m.FullName $dir
            Push-Location "stage-$i"
            7z a -tzip -mx=1 ("../parts/Iskra-GigaChat-chast-{0:D2}.zip" -f $i) Iskra | Out-Null
            Pop-Location
            $i++
          }
          Get-ChildItem parts | ForEach-Object { Write-Host "$($_.Name): $([math]::Round($_.Length / 1MB)) МБ" }
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete iskra-model-gigachat --yes --cleanup-tag || true
          gh release create iskra-model-gigachat parts/*.zip --prerelease --target "$GITHUB_SHA" \
            --title "Искра: нейросеть GigaChat 3.1 (дополнение)" \
            --notes "Отечественная модель GigaChat 3.1 10B-A1.8B (Сбер, лицензия MIT). Скачайте ВСЕ части Iskra-GigaChat-chast-01 … NN и распакуйте в папку, где лежит Iskra (в одну папку, с заменой). Затем Файл → Выбрать нейросеть → GigaChat. Основная модель Qwen остаётся, переключаться можно в любой момент. Нужно Искра 1.10.3 или новее, 16 ГБ памяти."
